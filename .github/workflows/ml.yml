name: ml
on:
  pull_request:
    branches: [dev, main]
    paths: ["ml/**", ".github/workflows/ml.yml"]
  push:
    branches: [dev]
    paths: ["ml/**", ".github/workflows/ml.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML test dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run ML tests
        run: python -m pytest ml/tests -q
