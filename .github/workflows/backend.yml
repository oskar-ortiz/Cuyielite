name: backend
on:
  pull_request:
    branches: [dev, main]
    paths: ["backend/**", "db/**", ".github/workflows/backend.yml"]
  push:
    branches: [dev]
    paths: ["backend/**", "db/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest backend
