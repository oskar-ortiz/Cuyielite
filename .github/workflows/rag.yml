name: rag
on:
  pull_request:
    branches: [dev, main]
    paths: ["rag/**", ".github/workflows/rag.yml"]
  push:
    branches: [dev]
    paths: ["rag/**", ".github/workflows/rag.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RAG test dependencies
        run: python -m pip install -r rag/requirements.txt
      - name: Run RAG tests without database services
        run: python -m pytest rag/tests -m "not db" -q
